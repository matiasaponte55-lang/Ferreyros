# ===================================================================
# CONFIGURACIÓN DEL SERVIDOR SERVTECH 2026 (FERREYROS S.A.)
# ===================================================================
server.port=8080
server.servlet.context-path=/

# ===================================================================
# COMPRESIÓN HTTP GZIP DE ALTO RENDIMIENTO
# ===================================================================
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# ===================================================================
# CONEXIÓN A POSTGRESQL EN SUPABASE CLOUD (IPv4 POOLER - sa-east-1)
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=disable&prepareThreshold=5}
spring.datasource.username=${DB_USER:postgres.zijnbuwancwbvdoizopz}
spring.datasource.password=${DB_PASSWORD:FERREYROS12}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# 'none': Las tablas ya existen en Supabase Cloud. No realiza introspección pesada al arrancar.
spring.jpa.hibernate.ddl-auto=none

# Mostrar consultas SQL en consola
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# POOL DE CONEXIONES DE ALTO RENDIMIENTO (HIKARICP - CERO LATENCIA)
# ===================================================================
spring.datasource.hikari.pool-name=FerreyrosHikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.auto-commit=true

# ===================================================================
# SEGURIDAD Y TOKENS JWT (HMAC-SHA256)
# ===================================================================
servtech.jwt.secret=${JWT_SECRET:FerreyrosServTech2026SecureKeyWithMin256BitsLengthForHmacSha256Security}
servtech.jwt.expiration=86400000

# ===================================================================
# SUBIDA DE EVIDENCIAS FOTOGRÁFICAS (RF-08)
# ===================================================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
servtech.upload.dir=uploads/evidencias

# ===================================================================
# NOTIFICACIONES POR CORREO ELECTRÓNICO (JAKARTA MAIL / GMAIL SMTP)
# ===================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:ferreyrosservtech@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dtxqhwhzkdbbqbwz}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.debug=false

# Correo destinatario de alertas de reportes (personalizable vía MAIL_DESTINO)
servtech.mail.notificaciones-destino=${MAIL_DESTINO:matiasaponte55@gmail.com}
servtech.mail.remitente-nombre=Ferreyros ServTech - Alertas de Reportes
